<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>案内板の記録</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <header>
      <h1>案内板の記録</h1>
      <p>現地で吊り下げ看板の位置と向きを地図に記録し、<code>signs.json</code> に貼れる形で書き出すページです。対象は <strong id="floor-label">2階</strong> だけです。</p>
    </header>

    <section aria-labelledby="map-heading">
      <h2 id="map-heading">1. 地図で位置と向きを決める</h2>
      <div class="modes" role="radiogroup" aria-label="タップで決めるもの">
        <label class="mode"><input type="radio" name="mode" value="sign" checked> ① 看板の位置</label>
        <label class="mode"><input type="radio" name="mode" value="viewer"> ② 表を見ている自分の位置</label>
      </div>
      <p class="hint">① 看板の真下をタップ → ② 看板の表（写真を撮った面）を見上げている自分の位置をタップ。ドラッグで移動、ボタンで拡大縮小できます。</p>
      <div class="map-wrap">
        <svg id="survey-map" role="img" aria-label="2階の通路の地図" viewBox="0 0 100 100"></svg>
        <div class="zoom">
          <button type="button" id="zoom-in" aria-label="拡大">＋</button>
          <button type="button" id="zoom-out" aria-label="縮小">－</button>
        </div>
      </div>
      <p id="scale" class="hint"></p>
      <p id="picked" role="status">まだ位置を決めていません。</p>
    </section>

    <section aria-labelledby="form-heading">
      <h2 id="form-heading">2. 看板の情報</h2>
      <form id="sign-form" class="fields">
        <div>
          <label for="name">名前</label>
          <input id="name" type="text" maxlength="60" placeholder="例: 南改札前 中央線のりば案内" required>
        </div>
        <div>
          <label for="sign-id">ID（英数字とハイフン）</label>
          <input id="sign-id" type="text" maxlength="40" pattern="[A-Za-z0-9_\-]+" required>
        </div>
        <div class="pair">
          <div>
            <label for="width">絵柄の幅（m）</label>
            <input id="width" type="number" min="0.05" max="10" step="0.01" placeholder="1.80" required>
          </div>
          <div>
            <label for="height">絵柄の高さ（m）</label>
            <input id="height" type="number" min="0.05" max="5" step="0.01" placeholder="0.45" required>
          </div>
        </div>
        <div class="pair">
          <div>
            <label for="center-height">床から看板の中心（m）</label>
            <input id="center-height" type="number" min="0.1" max="10" step="0.1" value="2.5" required>
          </div>
          <div>
            <label for="azimuth">表の向き（度、北=0 時計回り）</label>
            <input id="azimuth" type="number" min="0" max="359.9" step="0.1" required>
          </div>
        </div>
        <div class="pair">
          <div>
            <label for="mount">取り付け</label>
            <select id="mount">
              <option value="hanging" selected>吊り下げ</option>
              <option value="wall">壁</option>
              <option value="pillar">柱</option>
            </select>
          </div>
          <div>
            <label for="confidence">値の確かさ</label>
            <select id="confidence">
              <option value="推定" selected>推定（地図をタップした）</option>
              <option value="実測">実測（現地で測った）</option>
              <option value="未確認">未確認</option>
            </select>
          </div>
        </div>
        <label class="check"><input id="both-faces" type="checkbox" checked> 裏面にも絵柄がある（裏面を反対向きの別の看板として記録する）</label>
        <div>
          <label for="note">メモ（近くの目印、写真のファイル名、測り方など）</label>
          <input id="note" type="text" maxlength="200" placeholder="例: 南改札を出て正面。幅はレーザー距離計。写真 IMG_1234">
        </div>
        <button type="submit">記録する</button>
        <p id="form-status" role="status"></p>
      </form>
    </section>

    <section aria-labelledby="list-heading">
      <h2 id="list-heading">3. 記録した看板</h2>
      <ul id="records" class="records"></ul>
      <p class="hint">記録はこのブラウザにだけ残ります。終わったら下の文字をコピーして、写真と一緒にチームに送ってください。</p>
      <label for="output">signs.json に貼る内容</label>
      <textarea id="output" rows="10" readonly></textarea>
      <div class="row">
        <button type="button" id="copy">コピーする</button>
        <button type="button" id="clear" class="secondary">全部消す</button>
      </div>
      <p id="copy-status" role="status"></p>
    </section>

    <footer>
      <p id="attribution"></p>
      <p><a href="/">経路のページへ</a></p>
    </footer>
  </main>
  <script src="/static/survey.js"></script>
</body>
</html>
