# 開発ツールの設定だけを置く（依存は requirements*.txt で管理している）
[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "S", "W"]
ignore = ["S101"]  # テストでの assert を許す

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
